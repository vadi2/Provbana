# The Nordic Hackathon 2026 - Provbana's first event, kept as the worked
# example. To run Provbana for another event, copy this folder, edit this file
# and matchbox.yaml, and point EVENT_DIR at the copy.

[event]
name = "Nordic Hackathon 2026"
url = "https://nordichackathon2026.blogs.dsv.su.se"
when_where = "18-20 November in Kista"
# The namespace of the identifiers the service mints (company ids, and the
# canonical URL of its CapabilityStatement). Defaults to https://$SITE_ADDRESS/fhir.
canonical_base = "https://nordichackathon2026.blogs.dsv.su.se/fhir"
# What the static archive (provbana/archive.py) says at the top of the page.
# Defaults to "The <name> is over - thank you for participating! ...".
# archive_note = ""

[documents]
# The track: what the leaderboard ranks, and what a bundle that announces
# nothing is scored as. The others are worth a flat bonus each.
primary = "eps"
enabled = ["eps", "laboratory", "mpd", "imaging", "hdr"]

# hl7se.fhir.base rides along on the patient summary only: it is a Swedish
# event and teams claim the Swedish base profiles on Patient, but they have
# nothing to say about a lab report or an imaging study.
[documents.eps]
extra_igs = ["hl7se.fhir.base#1.1.0"]

# [scoring] takes valid_base, section_points, resource_points, resource_cap,
# section_cap, first_pass_bonus and secondary_category_points. This event used
# the defaults.

# Synthetic worked examples of the scenarios, rendered in the clinical view.
# Each id is a bundle in samples/, generated by samples/generate.py.
# scenario_url points at the organisers' brief on the event's resources page
# (https://nordichackathon2026.blogs.dsv.su.se/resources/). The briefs are the
# source these bundles were authored from, so they are linked rather than
# paraphrased here - a paraphrase would be a second, drifting copy.

[[samples]]
id = "andrea-cross-border"
name = "Andrea Lindqvist, 24"
tagline = "Type 1 diabetes, seen in a Paris emergency department"
scenario = """\
A Swedish exchange student is brought into a Paris emergency department with \
runaway blood sugar. Her summary is complete and well coded, but the data \
behind it has gone stale: the last labs are eight months old and the \
follow-up that would have refreshed them was cancelled and never rebooked."""
horizon = """\
Future scenario: under the EHDS Regulation, cross-border exchange of patient \
summaries is required from around 2029."""
language = "English"
scenario_name = "The Andrea Scenario"
scenario_url = "https://drive.google.com/file/d/1hzOACA3chu7E6aknBFni-hZWDJwvVGHx/view"

[[samples]]
id = "arne-complex-care"
name = "Arne Bergström, 83"
tagline = "Multimorbid, admitted after a fall in Copenhagen"
scenario = """\
A Swedish pensioner falls while visiting his son in Denmark and needs \
surgery. Ten conditions, ten medicines including the anticoagulant apixaban, \
and a high-criticality penicillin allergy with anaphylaxis have to survive \
the border."""
horizon = """\
Future scenario: under the EHDS Regulation, cross-border exchange of patient \
summaries is required from around 2029, and of lab results and discharge \
reports only from around 2031."""
language = "Swedish"
scenario_name = "The Arne Scenario"
scenario_url = "https://drive.google.com/file/d/11dMseBg1439zSf2v8sRnWHSjrE18ZgLJ/view"

[[samples]]
id = "ville-difficult-airway"
name = "Vilhelm \"Ville\" Söderberg, 13"
tagline = "Difficult airway and immunosuppressed, in a Gothenburg emergency department"
scenario = """\
A Stockholm boy with a rare craniofacial syndrome, a known difficult airway \
and juvenile spondyloarthritis on adalimumab and methotrexate arrives at \
Sahlgrenska with a chest infection and worsening breathing. The team that has \
never met him needs the airway plan, the last anaesthetic, the last doses and \
who to ring at Karolinska - before anyone reaches for a laryngoscope."""
language = "Swedish"
scenario_name = "The Ville Scenario"
scenario_url = "https://drive.google.com/file/d/1_PzonjLJ-BjW1sQYdL6YY1dS04T8Kkpp/view"
