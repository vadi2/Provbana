server:
  servlet:
    context-path: /matchboxv3
hapi:
  fhir:
    implementationguides:
      eps:
        name: hl7.fhir.eu.eps
        version: 1.0.0-ballot
      sebase:
        name: hl7se.fhir.base
        version: 1.1.0

# Terminology is deliberately left off (Matchbox's packaged default is
# `txServer: n/a`). With it off, a code from a code system the IGs do not carry
# - ATC, SNOMED CT, LOINC - produces "the code cannot be validated" as a
# *warning* rather than an error: 51 of the 64 findings on
# samples/andrea-cross-border.json are of that kind, all of them warnings or
# information. app.py's drop_uncheckable_terminology() then removes them
# outright, whatever severity they arrived at, which is what actually
# guarantees a bundle is never failed for something we could not check. This
# setting is why that filter has so little to undo.
#
# Turning it on is one line:
#
#   matchbox:
#     fhir:
#       context:
#         txServer: https://tx.fhir.org/r4
#
# It is genuinely better validation - it found two dead codes in our own
# samples - and on a good network it costs nothing: 79s on the first bundle
# while the cache fills, 0.3s after. It is off anyway, because both of its
# failure modes land on the participants rather than on us:
#
#   * Unreachable when Matchbox boots -> Matchbox exits 1 and does not start.
#     No validator, no event, until the network is back.
#   * Unreachable once running -> anything already cached still validates, but
#     the first bundle carrying a code we have not seen gets a hard *error*
#     ("Refusing to fetch ... / UnknownHostException" from the TerminologyEngine)
#     and scores 0. It also drags two spurious "Slice 'Bundle.entry:composition':
#     a matching slice is required" errors along with it, so the team reads a
#     wifi outage as a broken bundle.
#
# There is no middle setting: `suppressWarnInfo` cannot soften an error. Turn
# this on for a venue on wired network, or once a terminology server runs on
# this machine - localhost cannot go down separately from the validator.
