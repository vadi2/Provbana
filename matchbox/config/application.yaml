server:
  servlet:
    context-path: /matchboxv3
hapi:
  fhir:
    implementationguides:
      # One package per EHDS Article 14 priority category this service scores,
      # plus the Swedish base. app.py's EHDS_DOCUMENTS decides which of these a given
      # submission is checked against; this list is only what the validator
      # holds. The two have to agree: a package named there and missing here
      # loads no profiles, so bundles of that category validate against nothing
      # and score as if they had passed. /fhir/$status reports that as
      # `degraded` and deploy.sh refuses to finish on it.
      #
      # eps is the one the event scores; the other three are the EHDS
      # categories the service also accepts, and a missing package there costs a
      # bonus rather than the track, but wrongly - so all four are gated the
      # same.
      #
      # The hospital discharge report guide (hl7.fhir.eu.hdr) is deliberately
      # absent. Not merely because it fails its own examples - so does imaging,
      # below, and that one is kept - but because its failure is not one a team
      # can build around: the guide binds Encounter.status to a value set
      # enumerating the R4 codes, while the R5 CodeSystem for
      # http://hl7.org/fhir/encounter-status, shipped by hl7.fhir.uv.xver-r5.r4
      # which its own dependencies pull in, shadows it. R5 renamed `finished`
      # to `completed`, so the `finished` a conformant discharge report carries
      # takes a hard error and drags two spurious "a matching slice is
      # required" errors with it. Every HDR example in the package hits it, and
      # it is not fixable from here - it needs the guide or the xver package to
      # change. Restore this entry, and the one in app.py's EHDS_DOCUMENTS,
      # once one of them has.
      #
      # Loading all of them together was verified, not assumed - the guides pin
      # two different versions of hl7.fhir.eu.base (2.0.0-ballot for imaging,
      # 2.0.0 for eps and laboratory) and Matchbox loads both side by side
      # without complaint. Cold boot was about 160s and roughly 40 packages
      # once the dependencies were resolved, against ~30s for eps alone -
      # measured with the discharge guide still in the list, so the current set
      # boots somewhat faster and lighter than that.
      eps:
        name: hl7.fhir.eu.eps
        version: 1.0.0-ballot
      lab:
        name: hl7.fhir.eu.laboratory
        version: 2.0.0
      mpd:
        name: hl7.fhir.eu.mpd
        version: 1.0.0
      imaging:
        name: hl7.fhir.eu.imaging
        version: 1.0.0-ballot
      sebase:
        name: hl7se.fhir.base
        version: 1.1.0

# One of these guides fails its own published examples here, which is worth
# knowing before anyone reads a score as a verdict on a participant's bundle:
#
#   * hl7.fhir.eu.imaging 1.0.0-ballot: both example bundles put
#     event-basedOn on the Composition, which CompositionEuImaging does not
#     allow. The profile is fine - deleting that one extension makes the
#     example validate clean - so a correctly built imaging report does pass.
#
# Terminology is deliberately left off (Matchbox's packaged default is
# `txServer: n/a`). With it off, a code from a code system the IGs do not carry
# - ATC, SNOMED CT, LOINC - produces "the code cannot be validated" as a
# *warning* rather than an error: 51 of the 64 findings on
# samples/andrea-cross-border.json are of that kind, all of them warnings or
# information. app.py's drop_uncheckable_terminology() then removes them
# outright, whatever severity they arrived at, which is what actually
# guarantees a bundle is never failed for something we could not check. This
# setting is why that filter has so little to undo.
#
# Turning it on is one line:
#
#   matchbox:
#     fhir:
#       context:
#         txServer: https://tx.fhir.org/r4
#
# It is genuinely better validation - it found two dead codes in our own
# samples - and on a good network it costs nothing: 79s on the first bundle
# while the cache fills, 0.3s after. It is off anyway, because both of its
# failure modes land on the participants rather than on us:
#
#   * Unreachable when Matchbox boots -> Matchbox exits 1 and does not start.
#     No validator, no event, until the network is back.
#   * Unreachable once running -> anything already cached still validates, but
#     the first bundle carrying a code we have not seen gets a hard *error*
#     ("Refusing to fetch ... / UnknownHostException" from the TerminologyEngine)
#     and scores 0. It also drags two spurious "Slice 'Bundle.entry:composition':
#     a matching slice is required" errors along with it, so the team reads a
#     wifi outage as a broken bundle.
#
# There is no middle setting: `suppressWarnInfo` cannot soften an error. Turn
# this on for a venue on wired network, or once a terminology server runs on
# this machine - localhost cannot go down separately from the validator.
