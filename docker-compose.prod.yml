# The event stack, as it runs on the VPS behind hackathon2026.vadimperetok.in.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differs from itb/docker-compose.yml in four ways that matter:
#
#   * Nothing but Caddy publishes a port. Matchbox (8080) and the service
#     (8095) are reachable only on the compose network, so the Hetzner Cloud
#     Firewall in front of the box only ever has to allow 22, 80 and 443.
#   * The JVM heap is capped. The matchbox image hardcodes -Xmx12g in its CMD;
#     _JAVA_OPTIONS overrides that without having to restate the whole java
#     command, and mem_limit stops a runaway JVM taking the box down with it.
#   * State lives in named volumes, not the checkout.
#   * Every service caps its log file. Docker's default json-file driver has no
#     size limit, and this box runs for months before the event.
#
# itb/docker-compose.yml stays as it is - it is the local development
# validator, and its project name pins the itb_default network that
# connectathon/README.md's `docker run` line joins.

name: hackathon2026

# Docker's json-file driver keeps every line ever logged unless told not to.
# This box is up from September to November; matchbox alone is chatty enough to
# matter, and a full disk during the event is unrecoverable in the time
# available. Anchored here rather than on a service so that removing a service
# cannot take the rest of them back to unbounded with it.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  matchbox:
    # Pinned to the same tag as the dev compose file: a validator that changes
    # under the participants mid-event changes the scores.
    image: europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox:v4.1.14
    restart: unless-stopped
    volumes:
      # Read-only here: on the event box the package list is changed by editing
      # the file and recreating the container, never by the container itself.
      - ./matchbox/config:/config:ro
      # The FHIR package cache lives in ~/.fhir and is 95 MB of downloaded IGs.
      # Without this it sits in the container's writable layer and is thrown
      # away by every recreate, so a validator restarted at the venue would
      # need the internet to come back up at all. Mounted at /home/matchbox,
      # not at /home/matchbox/.fhir: .fhir is created at runtime, and a volume
      # over a path the image does not contain is created root-owned, which the
      # matchbox user (uid 1000) then cannot write to. /home/matchbox does
      # exist in the image, so the volume inherits its ownership.
      #
      # /database is deliberately not persisted: matchbox rebuilds it from the
      # packages at boot, and a stale copy is exactly how an edit to the IG
      # list in matchbox/config/application.yaml would fail to take effect.
      - matchbox_home:/home/matchbox
    environment:
      # Read once at boot, like application.yaml. Bump both numbers together -
      # the limit needs headroom over the heap for JVM metaspace, code cache
      # and thread stacks, or the kernel OOM-kills the validator instead of
      # the JVM throwing an OutOfMemoryError you can see in the log.
      _JAVA_OPTIONS: -Xmx${MATCHBOX_HEAP:-8g}
      # Matchbox ships with OpenTelemetry export on and nothing listening, so
      # the log fills with "Failed to export" noise.
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    mem_limit: ${MATCHBOX_MEM_LIMIT:-10g}
    logging: *logging
    # No ports: reached as http://matchbox:8080/matchboxv3/fhir from the app.

  app:
    build: ./connectathon
    restart: unless-stopped
    environment:
      DATA_DIR: /srv/data
      MATCHBOX_URL: http://matchbox:8080/matchboxv3/fhir
      # Loading the IGs takes a minute or two from cold. A submission that runs
      # out of this budget is a 502 and is not stored at all - no score, no
      # findings, just a team told to try again. Raise it if a validation on
      # this box ever measures close; deploy/deploy.sh warms the validator so
      # the first submission of the event does not pay the cold cost.
      MATCHBOX_TIMEOUT: ${MATCHBOX_TIMEOUT:-60}
      # Unset leaves registration open to anyone who can reach the URL. The box
      # is public from the day it goes up, so set this in .env before the event
      # and hand the code to the teams.
      REGISTER_CODE: ${REGISTER_CODE:-}
      # Only so the page can say the board is being wiped. The wiping itself is
      # the reset service's job; this container never deletes anything.
      PRACTICE_ENDS: ${PRACTICE_ENDS:-}
    volumes:
      - state:/srv
    depends_on:
      - matchbox
    # Small next to the validator's, and that is the point: whatever a
    # submission does to this process must not be able to take the box, and the
    # validator with it, down. Baseline is around 100 MB.
    mem_limit: 2g
    logging: *logging
    # No ports: Caddy is the only front door.

  backup:
    # Same image as the service - backup.py opens the database directly, so it
    # has to see the same bytes on the same filesystem, not an HTTP endpoint.
    build: ./connectathon
    restart: unless-stopped
    command: ["python", "backup.py", "--loop"]
    environment:
      DATA_DIR: /srv/data
      # Beside the data directory inside the one volume, never inside it: a
      # restore moves the data directory wholesale and the backups have to
      # survive that. Same filesystem is also what keeps link_tree() on its
      # hard-link path instead of falling back to copying every submission.
      BACKUP_DIR: /srv/backups
    volumes:
      - state:/srv
    depends_on:
      - app
    mem_limit: 512m
    logging: *logging

  reset:
    # Same image again, for the same reason as backup: it opens the database
    # directly. Empties the leaderboard daily while the service is open for
    # practice, and stops for good at PRACTICE_ENDS - reset.py's docstring has
    # the semantics. Unset PRACTICE_ENDS and this container idles, which is the
    # right state for an event that has started.
    build: ./connectathon
    restart: unless-stopped
    command: ["python", "reset.py", "--loop"]
    environment:
      DATA_DIR: /srv/data
      PRACTICE_ENDS: ${PRACTICE_ENDS:-}
    volumes:
      - state:/srv
    depends_on:
      - app
    mem_limit: 512m
    logging: *logging

  warm:
    # The service's image again, but for a different reason than backup and
    # reset: this one touches no state at all. It imports app.py purely to
    # reuse the document registry and the $validate call, so that the set of
    # categories it keeps warm cannot drift from the set the service accepts.
    #
    # What it is for: Matchbox compiles a validation engine per guide on first
    # use - 26 to 135 seconds each on this box, against a 60s MATCHBOX_TIMEOUT
    # - and then lets them go again after some tens of minutes idle, with no
    # restart and nothing in the log. deploy/deploy.sh warms them once at
    # deploy time; without this container that wears off long before the event
    # starts, and the first team to submit an imaging report eats a 502.
    # warm.py's docstring has the measurements.
    build: ./connectathon
    restart: unless-stopped
    command: ["python", "warm.py", "--loop"]
    environment:
      MATCHBOX_URL: http://matchbox:8080/matchboxv3/fhir
      # Not MATCHBOX_TIMEOUT: the service's budget is short so that a
      # participant is never left hanging, and a warm pass that has to compile
      # from cold needs minutes. warm.py overrides it per call.
      WARM_INTERVAL: ${WARM_INTERVAL:-1200}
      WARM_TIMEOUT: ${WARM_TIMEOUT:-600}
    depends_on:
      - matchbox
    # Four HTTP calls every twenty minutes. The work is all on the validator's
    # side; this process holds one bundle in memory.
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account key. Losing this volume means
      # re-issuing from Let's Encrypt, which is rate-limited - keep it.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-hackathon2026.vadimperetok.in}
    depends_on:
      - app
    logging: *logging

volumes:
  # One volume, holding data/ and backups/ side by side. Both the hard-linking
  # and the restore rename depend on them sharing a filesystem.
  state:
  # The validator's downloaded IG packages - see the matchbox service above.
  matchbox_home:
  caddy_data:
  caddy_config:
