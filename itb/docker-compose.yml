# Matchbox - the FHIR validator the connectathon service calls.
#
# The project name below fixes the network name to "itb_default", which the
# connectathon container joins with `docker run --network itb_default ...` and
# where it resolves the validator as http://matchbox:8080/matchboxv3/fhir.
# Renaming the project renames the network, so leave `name: itb` alone.
#
#   docker compose -p itb up -d matchbox
#   -> http://localhost:8090/matchboxv3/fhir
#
# The GITB/ITB test bed that used to live here has been retired - the
# connectathon service is the whole platform now. The connectathon service
# itself is deliberately not defined here either: an organiser runs one
# instance by hand (see connectathon/README.md) and a second copy of it here
# would fight over host port 8095.

name: itb

services:
  matchbox:
    image: europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ../matchbox/config:/config
